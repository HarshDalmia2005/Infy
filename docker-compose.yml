version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/infyboard?schema=public
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-changeme123}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - AUTH_TRUST_HOST=true
    depends_on:
      - db
    volumes:
      - ./.boards:/app/.boards

  db:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=infyboard
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
